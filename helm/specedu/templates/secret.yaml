apiVersion: v1
kind: Secret
metadata:
  name: specedu-app
type: Opaque
stringData:
  ConnectionStrings__SpecEduConnectionString: {{ required "secrets.dbConnection is required (pass via --set)" .Values.secrets.dbConnection | quote }}
  JwtSettings__Secret: {{ required "secrets.jwtSecret is required (pass via --set)" .Values.secrets.jwtSecret | quote }}
