---
# Let's Encrypt Issuer (Production)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.certificates.email }}
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: traefik

---
{{- if .Values.webPublic.enabled }}
# Certificate for main branch - Web Public
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: specedu-cert-main
  namespace: {{ .Values.namespace }}
spec:
  secretName: specedu-tls-main
  issuerRef:
    name: {{ .Values.certificates.issuer }}
    kind: ClusterIssuer
  dnsNames:
  {{- range .Values.webPublic.ingress.main.hosts }}
  - {{ . }}
  {{- end }}

---
# Certificate for test branch - Web Public
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: specedu-cert-test
  namespace: {{ .Values.namespace }}
spec:
  secretName: specedu-tls-test
  issuerRef:
    name: {{ .Values.certificates.issuer }}
    kind: ClusterIssuer
  dnsNames:
  {{- range .Values.webPublic.ingress.test.hosts }}
  - {{ . }}
  {{- end }}
{{- end }}

---
{{- if .Values.webApp.enabled }}
# Certificate for main branch - Web App
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: specedu-app-cert-main
  namespace: {{ .Values.namespace }}
spec:
  secretName: specedu-app-tls-main
  issuerRef:
    name: {{ .Values.certificates.issuer }}
    kind: ClusterIssuer
  dnsNames:
  {{- range .Values.webApp.ingress.main.hosts }}
  - {{ . }}
  {{- end }}

---
# Certificate for test branch - Web App
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: specedu-app-cert-test
  namespace: {{ .Values.namespace }}
spec:
  secretName: specedu-app-tls-test
  issuerRef:
    name: {{ .Values.certificates.issuer }}
    kind: ClusterIssuer
  dnsNames:
  {{- range .Values.webApp.ingress.test.hosts }}
  - {{ . }}
  {{- end }}
{{- end }}
