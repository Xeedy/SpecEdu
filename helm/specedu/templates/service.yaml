---
{{- if .Values.webPublic.enabled }}
# Web Public Main Service
apiVersion: v1
kind: Service
metadata:
  name: web-public-main
  namespace: {{ .Values.namespace }}
  labels:
    app: specedu
    component: web-public
    branch: main
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.webPublic.service.port }}
    targetPort: {{ .Values.webPublic.service.port }}
    protocol: TCP
    name: http
  selector:
    app: specedu
    component: web-public
    branch: main

---
# Web Public Test Service
apiVersion: v1
kind: Service
metadata:
  name: web-public-test
  namespace: {{ .Values.namespace }}
  labels:
    app: specedu
    component: web-public
    branch: test
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.webPublic.service.port }}
    targetPort: {{ .Values.webPublic.service.port }}
    protocol: TCP
    name: http
  selector:
    app: specedu
    component: web-public
    branch: test
{{- end }}

