{{- if .Values.webPublic.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-public
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        {{- range .Values.webPublic.ingress.hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ .Values.webPublic.ingress.tlsSecretName }}
  rules:
    {{- range .Values.webPublic.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-public
                port:
                  number: {{ $.Values.webPublic.service.port }}
    {{- end }}
{{- end }}
