---
# Main branch - Web Public
{{- if .Values.webPublic.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-public-main
  namespace: {{ .Values.namespace }}
  labels:
    app: specedu
    component: web-public
    branch: main
spec:
  replicas: {{ .Values.webPublic.replicas.main }}
  selector:
    matchLabels:
      app: specedu
      component: web-public
      branch: main
  template:
    metadata:
      labels:
        app: specedu
        component: web-public
        branch: main
    spec:
      containers:
      - name: web-public
        image: "{{ .Values.webPublic.image.repository }}:main"
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.webPublic.service.port }}
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: {{ .Values.environment }}
        resources:
          requests:
            memory: {{ .Values.webPublic.resources.requests.memory }}
            cpu: {{ .Values.webPublic.resources.requests.cpu }}
          limits:
            memory: {{ .Values.webPublic.resources.limits.memory }}
            cpu: {{ .Values.webPublic.resources.limits.cpu }}
        livenessProbe:
          httpGet:
            path: {{ .Values.healthChecks.liveness.path }}
            port: {{ .Values.webPublic.service.port }}
          initialDelaySeconds: {{ .Values.healthChecks.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthChecks.liveness.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthChecks.readiness.path }}
            port: {{ .Values.webPublic.service.port }}
          initialDelaySeconds: {{ .Values.healthChecks.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthChecks.readiness.periodSeconds }}

