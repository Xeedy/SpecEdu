# Default values = Production (main branch)
# For test environment, override with -f values-test.yaml

webPublic:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/xeedy/specedu-web-public
    tag: latest
    pullPolicy: Always
  service:
    port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  ingress:
    hosts:
      - specedu.cz
      - www.specedu.cz
    tlsSecretName: specedu-tls

webApp:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/xeedy/specedu-web-app
    tag: latest
    pullPolicy: Always
  service:
    port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  ingress:
    hosts:
      - app.specedu.cz
    tlsSecretName: specedu-app-tls

ingress:
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"

environment: Production

healthChecks:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
